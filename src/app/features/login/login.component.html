<section class="flex flex-wrap flex-col lg:flex-row mt-5 md:mt-10 lg:mt-5">
  <form
    (ngSubmit)="loginSubmit()"
    [formGroup]="loginForm"
    class="lg:w-3/7 w-[90%] m-auto order-last lg:order-0 lg:mt-0 mt-10 lg:h-[calc(100vh-109px)] text-center lg:flex lg:flex-col lg:justify-center lg:items-center"
  >
    <div class=" ">
      <h1 class="text-4xl font-bold">Welcome <span class="text-main">Back</span></h1>
      <p class="m-4 text-body">Login to your account and continue shopping</p>
      <!-- floating label -->
      <div>
        <!-- email -->
        <div class="mb-3">
          <div class="relative">
            <input
              formControlName="email"
              type="email"
              id="emailInputsLogin"
              class="block px-2.5 cursor-pointer focus:cursor-text pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-base border-1 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-orange peer"
              placeholder=" "
            />
            <label
              for="emailInputsLogin"
              class="absolute text-sm text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-neutral-primary px-2 peer-focus:px-2 peer-focus:text-main peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto start-1"
              ><i class="fa-regular fa-envelope me-1"></i> Email</label
            >
          </div>

          <app-alert [formGroup]="loginForm" inputName="email" errorType="email">
            <ng-container firstMassage>Email is required.</ng-container>
            <ng-container secondMassage>Please enter a valid email address.</ng-container>
          </app-alert>
        </div>
        <!-- password -->
        <div class="mb-3">
          <div class="relative">
            <input
              formControlName="password"
              type="password"
              id="passwordLogin"
              class="block px-2.5 pb-2.5 cursor-pointer focus:cursor-text pt-4 w-full text-sm text-heading bg-transparent rounded-base border-1 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-orange peer"
              placeholder=" "
            />
            <label
              for="passwordLogin"
              class="absolute text-sm text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-[0] bg-neutral-primary px-2 peer-focus:px-2 peer-focus:text-main peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto start-1"
              ><i class="fa-solid fa-lock"></i> Password</label
            >
          </div>
          <app-alert [formGroup]="loginForm" inputName="password" errorType="pattern">
            <ng-container firstMassage>password is required.</ng-container>
            <ng-container secondMassage
              >must contain at least 8 chars, 1 uppercase,<br />1 lowercase, 1 number, and 1
              special</ng-container
            >
          </app-alert>
        </div>
      </div>
      <!-- remember me  //  forget password -->
      <div class="flex justify-between">
        <div class="flex items-center">
          <input
            id="checked-checkbox"
            type="checkbox"
            value=""
            class="size-3.5 cursor-pointer transition-all duration-300 checked:text-orange border border-gray-300 rounded-xs bg-gray-100 focus:ring-transparent checked:ring-2 checked:ring-orange"
          />
          <label for="checked-checkbox" class="select-none ms-2 text-sm font-medium text-black"
            >Remember me</label
          >
        </div>
        <span
          ><a
            routerLink="/forgot-password"
            class="text-main hover:text-orange transition-all duration-300"
            >forgot password..?</a
          ></span
        >
      </div>

      <button
        type="submit"
        class="p-3 rounded-[.625rem] my-3 text-white bg-main w-full cursor-pointer hover:bg-orange duration-300 transition-all"
      >
        Login
      </button>
      <div class="relative flex items-center justify-center mt-3 mb-5">
        <div class="w-full border-t border-gray-300"></div>
        <span
          class="absolute px-4 text-xs font-semibold tracking-wider text-gray-500 uppercase bg-white"
        >
          OR
        </span>
      </div>
      <div>
        <div class="flex gap-2 justify-between w-full mb-3">
          <!-- Google Button -->
          <button
            type="button"
            class="flex items-center py-3 justify-center gap-3 w-full px-2 bg-white border border-gray-200 rounded-xl text-slate-700 font-semibold text-sm hover:bg-slate-50 active:bg-slate-100 transition-colors cursor-pointer shadow-xs"
          >
            <svg class="w-8 h-8 lg:w-5 lg:h-5" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
              />
            </svg>
            <span>Login by Google</span>
          </button>

          <!-- Facebook Button -->
          <button
            type="button"
            class="flex items-center justify-center py-3 gap-3 w-full px-2 bg-white border border-gray-200 rounded-xl text-slate-700 font-semibold text-sm hover:bg-slate-50 active:bg-slate-100 transition-colors cursor-pointer shadow-xs"
          >
            <svg class="w-8 h-8 lg:w-5 lg:h-5 fill-[#1877F2]" viewBox="0 0 24 24">
              <path
                d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
              />
            </svg>
            <span>Login by Facebook</span>
          </button>
        </div>
      </div>
      <p class="my-2">
        Don't have acount?
        <span
          routerLink="/register"
          class="text-main cursor-pointer ms-1 hover:text-orange transition-all duration-300"
          >Sign up...</span
        >
      </p>
    </div>
  </form>
  <div class="lg:w-4/7">
    <img class="w-full object-cover" src="/images/AuthPage.png" alt="" />
  </div>
</section>
