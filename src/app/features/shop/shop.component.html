<div class="container mx-auto mt-[50px]">
  <app-header>
    <h2 class="text-3xl font-bold tracking-tight text-slate-900">
      Shop
      <span class="bg-gradient-to-r from-main to-orange bg-clip-text text-transparent">
        Everything
      </span>
    </h2>
    <p class="text-sm text-slate-500 mt-1">Discover great products made for you.</p>
  </app-header>
  <div class="block sm:flex sm:items-start sm:gap-3">
    <div
      class="w-[90%] m-auto mb-5 sm:m-0 sm:w-[22%] lg:w-[17%] flex flex-col gap-5 sm:sticky top-[110px]"
    >
      <div
        [class]="isBrandAppear() ? 'h-[18.75rem]' : 'h-fit'"
        class="bg-white p-4 border border-gray-100 shadow-sm rounded-[.625rem] overflow-auto"
      >
        <span class="flex justify-between"
          >Brands
          @if (isBrandAppear()) {
            <span (click)="isBrandAppear.set(false)"
              ><i class="fa-solid fa-minus text-gray-500 hover:text-gray-900 cursor-pointer"></i
            ></span>
          } @else {
            <span (click)="isBrandAppear.set(true)">
              <i class="fa-solid fa-plus text-gray-500 hover:text-gray-900 cursor-pointer"></i>
            </span>
          }
        </span>

        <div [class]="isBrandAppear() ? '' : 'hidden'">
          @for (brand of brandList(); track brand._id) {
            <div class="flex items-center gap-2 mt-1 ms-1">
              <input
                [value]="brand._id"
                [id]="brand._id"
                type="checkbox"
                (change)="changeSelectedBrand(brand._id, $event)"
              />
              <label class="text-[1rem]" [for]="brand._id">{{ brand.name }}</label>
            </div>
          }
        </div>
      </div>
      <div
        [class]="isCategoryAppear() ? 'h-[18.75rem]' : 'h-fit'"
        class="bg-white p-4 border border-gray-100 shadow-sm rounded-[.625rem] overflow-auto"
      >
        <span class="flex justify-between"
          >Categories
          @if (isCategoryAppear()) {
            <span (click)="isCategoryAppear.set(false)"
              ><i class="fa-solid fa-minus text-gray-500 hover:text-gray-900 cursor-pointer"></i
            ></span>
          } @else {
            <span (click)="isCategoryAppear.set(true)">
              <i class="fa-solid fa-plus text-gray-500 hover:text-gray-900 cursor-pointer"></i>
            </span>
          }
        </span>

        <div [class]="isCategoryAppear() ? '' : 'hidden'">
          @for (category of categoryList(); track category._id) {
            <div class="flex items-center gap-2 mt-1 ms-1">
              <input
                [id]="category._id"
                type="checkbox"
                (change)="changeSelectedCategory(category._id, $event)"
              />
              <label class="text-[1rem]" [for]="category._id">{{ category.name }}</label>
            </div>
          }
        </div>
      </div>
      <div class="">
        <div class="flex flex-col gap-1">
          <span>Min (EGP)</span>
          <input
            type="number"
            class="rounded-[.625rem] focus:border-orange focus:ring-0 cursor-pointer focus:cursor-text"
            placeholder="0"
            (input)="changeMinprice($event)"
          />
        </div>
        <div class="flex flex-col gap-1 mt-3">
          <span>Max (EGP)</span>
          <input
            type="number"
            class="rounded-[.625rem] focus:border-orange focus:ring-0 cursor-pointer focus:cursor-text"
            placeholder="No limit"
            (input)="changeMaxprice($event)"
          />
        </div>
      </div>
      <div>
        <button
          (click)="clearFiters()"
          class="p-2 rounded-[10px] bg-main hover:bg-orange cursor-pointer text-white text-sm sm:text-base"
        >
          <i class="fas fa-shopping-cart"></i> clear filters
        </button>
      </div>
    </div>
    <app-product-list class="flex-1"></app-product-list>
  </div>
</div>
